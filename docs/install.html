<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalar eSIM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 48px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .icon {
            font-size: 56px;
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: #1d1d1f;
            font-size: 32px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #86868b;
            font-size: 17px;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .info-card {
            background: #f5f5f7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .info-card p {
            color: #1d1d1f;
            font-size: 15px;
            line-height: 1.6;
            margin: 8px 0;
        }

        .info-card p:first-child {
            margin-top: 0;
        }

        .btn {
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:hover {
            background: #0077ed;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #86868b;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            text-align: center;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.info {
            background: #e8f4fd;
            color: #0071e3;
        }

        .status.success {
            background: #e8f5e9;
            color: #34c759;
        }

        .status.error {
            background: #fff3f3;
            color: #ff3b30;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 113, 227, 0.2);
            border-top: 2px solid #0071e3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .store-links {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #d2d2d7;
            display: none;
        }

        .store-links.show {
            display: block;
        }

        .store-links p {
            color: #86868b;
            font-size: 14px;
            text-align: center;
            margin-bottom: 16px;
        }

        .store-buttons {
            display: flex;
            gap: 12px;
        }

        .store-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .store-btn.android {
            background: #34c759;
            color: white;
        }

        .store-btn.android:hover {
            background: #30b350;
        }

        .store-btn.ios {
            background: #0071e3;
            color: white;
        }

        .store-btn.ios:hover {
            background: #0077ed;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            color: #86868b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>Instalar eSIM</h1>
        <p class="subtitle">Configure seu eSIM em segundos</p>

        <div class="info-card">
            <p>• Instalação automática</p>
            <p>• Sem configuração manual</p>
            <p>• Ativação instantânea</p>
        </div>

        <button class="btn" id="installBtn" onclick="installESim()">
            Instalar Agora
        </button>

        <div id="status" class="status"></div>

        <div id="storeLinks" class="store-links">
            <p>App não instalado? Baixe primeiro:</p>
            <div class="store-buttons">
                <a href="https://play.google.com/store/apps/details?id=com.example.scconecta_app" 
                   class="store-btn android" target="_blank">
                    Android
                </a>
                <a href="https://apps.apple.com/app/scconecta/id123456789" 
                   class="store-btn ios" target="_blank">
                    iOS
                </a>
            </div>
        </div>

        <div class="footer">
            Instalação segura e criptografada
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lpaString = urlParams.get('lpa');

        if (!lpaString) {
            showStatus('Link inválido', 'error');
            document.getElementById('installBtn').disabled = true;
        }

        function detectPlatform() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(ua)) return 'android';
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
            return 'unknown';
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type} show`;
            statusDiv.innerHTML = message;
        }

        function installESim() {
            if (!lpaString) return;

            const btn = document.getElementById('installBtn');
            btn.disabled = true;
            btn.textContent = 'Abrindo...';
            
            showStatus('<span class="loading"></span>Abrindo app...', 'info');

            const deepLink = `scconecta://install?lpa=${encodeURIComponent(lpaString)}`;
            window.location.href = deepLink;

            setTimeout(() => {
                if (document.hasFocus()) {
                    showStatus('App não encontrado', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Instalar Agora';
                    document.getElementById('storeLinks').classList.add('show');
                }
            }, 2500);
        }
    </script>
</body>
</html>
