<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSIM - Instalação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 48px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .icon {
            font-size: 56px;
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: #1d1d1f;
            font-size: 32px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #86868b;
            font-size: 17px;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .info-card {
            background: #f5f5f7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .info-card p {
            color: #1d1d1f;
            font-size: 15px;
            line-height: 1.6;
            margin: 8px 0;
        }

        .info-card p:first-child {
            margin-top: 0;
        }

        .btn {
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn:hover {
            background: #0077ed;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .links {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #d2d2d7;
        }

        .links p {
            color: #86868b;
            font-size: 14px;
            text-align: center;
            margin-bottom: 16px;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .link-item:hover {
            background: #e8e8ed;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            color: #86868b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>eSIM</h1>
        <p class="subtitle">Conectividade internacional</p>

        <div class="info-card">
            <p>• Instalação automática</p>
            <p>• Ativação instantânea</p>
            <p>• Sem configuração manual</p>
        </div>

        <a href="install.html?lpa=LPA:1$RSP-TEST.EXAMPLE.COM$TEST-CODE" class="btn">
            Começar
        </a>

        <div class="links">
            <p>Páginas de teste:</p>
            <div class="link-list">
                <a href="install.html?lpa=LPA:1$RSP-TEST.EXAMPLE.COM$TEST-CODE" class="link-item">
                    <span>Instalar eSIM</span>
                    <span>→</span>
                </a>
                <a href="activate.html?code=DEMO123" class="link-item">
                    <span>Ativar eSIM</span>
                    <span>→</span>
                </a>
                <a href="activate-real.html" class="link-item">
                    <span>Ativar eSIM Real</span>
                    <span>→</span>
                </a>
            </div>
        </div>

        <div class="footer">
            Conexão segura e criptografada
        </div>
    </div>
</body>
</html>
