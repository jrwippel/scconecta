<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSIM - Instalação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #8DBB1B 0%, #6A9515 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8DBB1B 0%, #6A9515 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 32px;
            box-shadow: 0 8px 24px rgba(141, 187, 27, 0.3);
        }

        h1 {
            color: #1d1d1f;
            font-size: 36px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #6e6e73;
            font-size: 18px;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.4;
        }

        .info-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid #e0e0e0;
        }

        .info-item {
            display: flex;
            align-items: center;
            color: #1d1d1f;
            font-size: 16px;
            line-height: 1.6;
            margin: 12px 0;
        }

        .info-item:first-child {
            margin-top: 0;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-item::before {
            content: '✓';
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #8DBB1B;
            color: white;
            border-radius: 50%;
            margin-right: 12px;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .btn {
            background: linear-gradient(135deg, #8DBB1B 0%, #6A9515 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 18px 32px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(141, 187, 27, 0.4);
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(141, 187, 27, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 32px 0;
            color: #86868b;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #d2d2d7;
        }

        .divider span {
            padding: 0 16px;
        }

        .test-links {
            margin-top: 24px;
        }

        .test-title {
            color: #1d1d1f;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-item {
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            background: #f8f9fa;
            color: #1d1d1f;
            border: 1px solid #e0e0e0;
        }

        .link-item:hover {
            background: #e9ecef;
            transform: translateX(4px);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #86868b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🌍</div>
        <h1>eSIM Internacional</h1>
        <p class="subtitle">Conectividade global em segundos</p>

        <div class="info-card">
            <div class="info-item">Instalação automática</div>
            <div class="info-item">Ativação instantânea</div>
            <div class="info-item">Sem configuração manual</div>
        </div>

        <a href="install.html?lpa=LPA:1$RSP-TEST.EXAMPLE.COM$TEST-CODE" class="btn">
            Começar
        </a>

        <div class="divider"><span>Páginas de teste</span></div>

        <div class="test-links">
            <div class="link-list">
                <a href="install.html?lpa=LPA:1$RSP-TEST.EXAMPLE.COM$TEST-CODE" class="link-item">
                    <span>Instalar eSIM</span>
                    <span>→</span>
                </a>
                <a href="activate.html?code=DEMO123" class="link-item">
                    <span>Ativar eSIM</span>
                    <span>→</span>
                </a>
                <a href="activate-real.html" class="link-item">
                    <span>Ativar eSIM Real</span>
                    <span>→</span>
                </a>
            </div>
        </div>

        <div class="footer">
            Conexão segura e criptografada
        </div>
    </div>
</body>
</html>
