<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSIM - Instalação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #8DBB1B 0%, #6A9515 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8DBB1B 0%, #6A9515 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            box-shadow: 0 8px 24px rgba(141, 187, 27, 0.3);
        }

        .icon svg {
            width: 44px;
            height: 44px;
            fill: white;
        }

        h1 {
            color: #1d1d1f;
            font-size: 36px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #6e6e73;
            font-size: 18px;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.4;
        }

        .info-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid #e0e0e0;
        }

        .info-item {
            display: flex;
            align-items: center;
            color: #1d1d1f;
            font-size: 16px;
            line-height: 1.6;
            margin: 12px 0;
        }

        .info-item:first-child {
            margin-top: 0;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-item::before {
            content: '✓';
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #8DBB1B;
            color: white;
            border-radius: 50%;
            margin-right: 12px;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message {
            text-align: center;
            color: #6e6e73;
            font-size: 16px;
            line-height: 1.6;
            padding: 24px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #86868b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M19,3H5C3.89,3 3,3.89 3,5V19C3,20.11 3.89,21 5,21H19C20.11,21 21,20.11 21,19V5C21,3.89 20.11,3 19,3M19,5V19H5V5H19M7,7V9H9V7H7M11,7V9H17V7H11M7,11V13H11V11H7M13,11V13H17V11H13M7,15V17H9V15H7M11,15V17H17V15H11Z"/>
            </svg>
        </div>
        <h1>eSIM Internacional</h1>
        <p class="subtitle">Conectividade global em segundos</p>

        <div class="info-card">
            <div class="info-item">Instalação automática</div>
            <div class="info-item">Ativação instantânea</div>
            <div class="info-item">Sem configuração manual</div>
        </div>

        <div class="message">
            Você receberá um link personalizado via WhatsApp ou e-mail para instalar seu eSIM.
        </div>

        <div class="footer">
            Conexão segura e criptografada
        </div>
    </div>
</body>
</html>
